# Deploys the hosted demo to the Droplet made by demo-provision.
# Ships code only. Case data (SQLite + files) is seeded from a local machine
# with deploy/seed-data.sh and never passes through GitHub (public repo).
name: demo-deploy

# Manual only: auto-deploying every push to main restarted the API and killed
# in-flight Clio syncs. Run: gh workflow run demo-deploy.yml
on:
  workflow_dispatch:

concurrency: demo-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DROPLET: law-di-gras-demo
      DEMO_DOMAIN: ${{ vars.DEMO_DOMAIN || 'demo.redducklaw.com' }}
      AUTH_USER: ${{ vars.DEMO_BASIC_AUTH_USER || 'demo' }}
      HAS_TOKEN: ${{ secrets.DO_TOKEN != '' }}
    steps:
      - uses: digitalocean/action-doctl@v2
        if: env.HAS_TOKEN == 'true'
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Find the Droplet
        id: host
        if: env.HAS_TOKEN == 'true'
        run: |
          ip=$(doctl compute droplet list --format Name,PublicIPv4 --no-header | awk -v d="$DROPLET" '$1==d{print $2}')
          if [ -z "$ip" ]; then
            echo "::notice::No $DROPLET Droplet yet; run demo-provision first. Skipping deploy."
          fi
          echo "ip=$ip" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.host.outputs.ip != ''
      - uses: actions/setup-node@v4
        if: steps.host.outputs.ip != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the frontend
        if: steps.host.outputs.ip != ''
        working-directory: frontend
        env:
          npm_config_os: linux # frontend/.npmrc pins win32 for local dev
        run: npm ci && npm run build

      - name: Write server config (secrets go only to the Droplet)
        if: steps.host.outputs.ip != ''
        env:
          DEMO_SSH_KEY: ${{ secrets.DEMO_SSH_KEY }}
          AUTH_PASSWORD: ${{ secrets.DEMO_BASIC_AUTH_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          CLIO_CLIENT_ID: ${{ secrets.CLIO_CLIENT_ID }}
          CLIO_CLIENT_SECRET: ${{ secrets.CLIO_CLIENT_SECRET }}
          CASE_VALUE_MULTIPLIER_LOW: ${{ vars.CASE_VALUE_MULTIPLIER_LOW }}
          CASE_VALUE_MULTIPLIER_HIGH: ${{ vars.CASE_VALUE_MULTIPLIER_HIGH }}
        run: |
          set -eu
          if [ -z "$AUTH_PASSWORD" ]; then echo "::error::DEMO_BASIC_AUTH_PASSWORD secret is not set"; exit 1; fi
          umask 077
          mkdir -p ~/.ssh "$RUNNER_TEMP/srv"
          printf '%s\n' "$DEMO_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          ssh-keyscan -T 30 "${{ steps.host.outputs.ip }}" >> ~/.ssh/known_hosts 2>/dev/null

          # app.env: single-quoted so Compose reads values literally. Unset values are left out.
          env_file="$RUNNER_TEMP/srv/app.env"
          : > "$env_file"
          # Clio tokens are not shipped: the app's Connect Clio page (/api/clio) stores them on the data volume.
          # APP_SESSION_SECRET: generated by the app on first use into /data/clio.env (persists across deploys).
          export APP_LOGIN_USER="$AUTH_USER" APP_LOGIN_PASSWORD="$AUTH_PASSWORD"
          export CLIO_REDIRECT_URI="https://$DEMO_DOMAIN/api/clio/callback"
          for k in ANTHROPIC_API_KEY OPENAI_API_KEY COHERE_API_KEY CLIO_CLIENT_ID CLIO_CLIENT_SECRET CLIO_REDIRECT_URI \
                   APP_LOGIN_USER APP_LOGIN_PASSWORD CASE_VALUE_MULTIPLIER_LOW CASE_VALUE_MULTIPLIER_HIGH; do
            v=$(printenv "$k" || true)
            if [ -n "$v" ]; then printf "%s='%s'\n" "$k" "$v" >> "$env_file"; fi
          done

      - name: Ship code and config, restart
        if: steps.host.outputs.ip != ''
        env:
          HOST: root@${{ steps.host.outputs.ip }}
        run: |
          set -eu
          ssh "$HOST" 'until [ -f /var/lib/cloud/instance/law-di-gras-ready ]; do sleep 5; done'
          rsync -az --delete --exclude .venv --exclude data --exclude __pycache__ backend/ "$HOST:/opt/law-di-gras/backend/"
          rsync -az --delete deploy/ "$HOST:/opt/law-di-gras/deploy/"
          rsync -az --delete frontend/dist/ "$HOST:/opt/law-di-gras/frontend-dist/"
          scp -q "$RUNNER_TEMP/srv/app.env" "$HOST:/etc/law-di-gras/"
          ssh "$HOST" "rm -f /etc/law-di-gras/auth.caddy"
          rm -rf "$RUNNER_TEMP/srv"
          ssh "$HOST" "chmod 600 /etc/law-di-gras/* && cd /opt/law-di-gras/deploy \
            && DEMO_DOMAIN=$DEMO_DOMAIN docker compose up -d --build --remove-orphans \
            && docker compose restart caddy && docker image prune -f >/dev/null"

      - name: Smoke test
        if: steps.host.outputs.ip != ''
        env:
          AUTH_PASSWORD: ${{ secrets.DEMO_BASIC_AUTH_PASSWORD }}
        run: |
          set -eu
          code=000
          for i in $(seq 1 36); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$DEMO_DOMAIN/api/health" || true)
            [ "$code" = "200" ] && break
            sleep 5
          done
          echo "/api/health -> $code (want 200)"; [ "$code" = "200" ]
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://$DEMO_DOMAIN/login")
          echo "/login -> $code (want 200, SPA)"; [ "$code" = "200" ]
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://$DEMO_DOMAIN/api/matters")
          echo "signed-out /api/matters -> $code (want 401)"; [ "$code" = "401" ]
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://$DEMO_DOMAIN/p/smoke-test")
          echo "/p/... -> $code (want 200)"; [ "$code" = "200" ]
          jar=$(mktemp)
          code=$(curl -s -o /dev/null -c "$jar" -w '%{http_code}' -H 'Content-Type: application/json'             --data "$(jq -n --arg u "$AUTH_USER" --arg p "$AUTH_PASSWORD" '{username:$u,password:$p}')"             "https://$DEMO_DOMAIN/api/auth/login")
          echo "login -> $code (want 200)"; [ "$code" = "200" ]
          code=$(curl -s -o /dev/null -b "$jar" -w '%{http_code}' "https://$DEMO_DOMAIN/api/matters")
          echo "signed-in /api/matters -> $code (want 200)"; rm -f "$jar"; [ "$code" = "200" ]
